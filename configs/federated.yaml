federated:
  num_clients: 5
  simulated_hospitals:
    - "Hospital_A_General"
    - "Hospital_B_Cardiac"
    - "Hospital_C_Pediatric"
    - "Hospital_D_Oncology"
    - "Hospital_E_UrgentCare"
  num_rounds: 10
  fraction_fit: 1.0
  local_epochs: 3
  batch_size: 64
  lr: 0.001
  aggregation: "FedAvg"
  partition_strategy: "dirichlet"
  dirichlet_alpha: 0.5
